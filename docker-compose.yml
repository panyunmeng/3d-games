# FNOS / 群晖 / 任意 Linux：docker compose up -d
services:
  tank3d:
    build: .
    image: tank3d:1.0.0
    container_name: tank3d
    restart: unless-stopped
    ports:
      - "8080:3000"        # 左边改成你想在 NAS 上用的端口
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
